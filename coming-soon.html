<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Something exciting is coming to BarberCo. A brand-new experience is being crafted — stay tuned and be the first to know.">
    <title>Coming Soon | BarberCo Barbershop</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%23B8860B' opacity='.15'/%3E%3Ccircle cx='30' cy='32' r='8' fill='none' stroke='%23B8860B' stroke-width='7'/%3E%3Ccircle cx='30' cy='68' r='8' fill='none' stroke='%23B8860B' stroke-width='7'/%3E%3Cline x1='36' y1='37' x2='72' y2='72' stroke='%23B8860B' stroke-width='8' stroke-linecap='round'/%3E%3Cline x1='36' y1='63' x2='72' y2='28' stroke='%23B8860B' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #111111; }
        .cs-bg {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .cs-bg img {
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.08;
            filter: grayscale(100%);
        }
        .cs-bg-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(17,17,17,0.98) 0%, rgba(17,17,17,0.85) 50%, rgba(28,20,5,0.95) 100%);
        }
        /* Decorative rings */
        .cs-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(184,134,11,0.08);
            animation: expand 12s ease-in-out infinite;
        }
        .cs-ring-1 { width:500px; height:500px; top:50%; left:50%; transform:translate(-50%,-50%); animation-delay:0s; }
        .cs-ring-2 { width:750px; height:750px; top:50%; left:50%; transform:translate(-50%,-50%); animation-delay:2s; }
        .cs-ring-3 { width:1050px; height:1050px; top:50%; left:50%; transform:translate(-50%,-50%); animation-delay:4s; }
        @keyframes expand { 0%,100%{opacity:0.08;} 50%{opacity:0.2;} }

        .cs-inner {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
            position: relative;
            z-index: 2;
        }
        .cs-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 48px;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .cs-logo:hover { opacity: 0.8; }
        .cs-logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 800;
            color: #FFFFFF;
        }
        .cs-logo-text span { color: #D4A017; }

        .cs-tagline {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #D4A017;
            margin-bottom: 20px;
        }
        .cs-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.4rem, 6vw, 4.5rem);
            font-weight: 900;
            color: #FFFFFF;
            line-height: 1.1;
            margin-bottom: 20px;
        }
        .cs-title em {
            font-style: italic;
            background: linear-gradient(135deg, #B8860B, #D4A017, #F0C060);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShimmer 4s linear infinite;
        }
        @keyframes goldShimmer { 0%{background-position:-200% center} 100%{background-position:200% center} }
        .cs-desc { color: rgba(255,255,255,0.5); font-size: 1rem; line-height: 1.8; max-width: 520px; margin: 0 auto 40px; }

        /* Barber pole divider */
        .cs-divider {
            width: 120px; height: 4px;
            border-radius: 4px;
            background: repeating-linear-gradient(
                90deg,
                #B8860B 0px, #B8860B 14px,
                #FFFFFF 14px, #FFFFFF 28px,
                #C0392B 28px, #C0392B 42px
            );
            margin: 0 auto 40px;
            animation: barberScroll 2s linear infinite;
        }

        /* Notify form */
        .cs-notify-form {
            display: flex;
            gap: 10px;
            max-width: 440px;
            width: 100%;
            margin: 0 auto 48px;
            flex-wrap: wrap;
        }
        .cs-notify-form input {
            flex: 1;
            min-width: 200px;
            padding: 14px 18px;
            border: 1.5px solid rgba(184,134,11,0.3);
            border-radius: 8px;
            background: rgba(255,255,255,0.06);
            color: #FFFFFF;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .cs-notify-form input::placeholder { color: rgba(255,255,255,0.35); }
        .cs-notify-form input:focus { border-color: #D4A017; }

        /* Countdown */
        .cs-countdown {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 48px;
            flex-wrap: wrap;
        }
        .cs-unit {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            width: 84px; height: 84px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: border-color 0.3s;
        }
        .cs-unit:hover { border-color: rgba(184,134,11,0.4); }
        .cs-unit-num {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: #D4A017;
            line-height: 1;
        }
        .cs-unit-label {
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            margin-top: 4px;
        }

        /* Social links */
        .cs-social {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }
        .cs-social a {
            width: 40px; height: 40px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.45);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: all 0.25s;
            text-decoration: none;
        }
        .cs-social a:hover { border-color: #D4A017; color: #D4A017; }

        .cs-home-link {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.35);
            margin-top: 40px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .cs-home-link a { color: #D4A017; text-decoration: none; font-weight: 600; }
        .cs-home-link a:hover { text-decoration: underline; }

        /* Icon btn override for dark page */
        .auth-top-icons .icon-btn { background:rgba(255,255,255,0.07); border-color:rgba(255,255,255,0.12); color:rgba(255,255,255,0.6); }
        .auth-top-icons .icon-btn:hover { border-color:#D4A017; color:#D4A017; }
    </style>
</head>
<body>

<!-- Top-right controls -->
<div class="auth-top-icons">
    <button class="icon-btn dark-toggle" id="cs-dark-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
        <i class="fas fa-moon"></i>
    </button>
    <button class="icon-btn rtl-toggle" id="cs-rtl-toggle" title="Toggle RTL" aria-label="Toggle RTL">
        <i class="fas fa-exchange-alt"></i>
    </button>
</div>

<!-- Background -->
<div class="cs-bg">
    <img src="assets/hero_home1.png" alt="" role="presentation" loading="eager">
    <div class="cs-bg-overlay"></div>
    <div class="cs-ring cs-ring-1"></div>
    <div class="cs-ring cs-ring-2"></div>
    <div class="cs-ring cs-ring-3"></div>
</div>

<div class="cs-inner">
    <!-- Logo → Home -->
    <a href="index.html" class="cs-logo" id="cs-logo" aria-label="BarberCo Home">
        <svg width="40" height="40" viewBox="0 0 100 100" fill="none">
            <rect width="100" height="100" rx="14" fill="#B8860B" opacity="0.18"/>
            <circle cx="30" cy="32" r="8" fill="none" stroke="#B8860B" stroke-width="3.5"/>
            <circle cx="30" cy="68" r="8" fill="none" stroke="#B8860B" stroke-width="3.5"/>
            <line x1="36" y1="37" x2="72" y2="72" stroke="#B8860B" stroke-width="4" stroke-linecap="round"/>
            <line x1="36" y1="63" x2="72" y2="28" stroke="#B8860B" stroke-width="4" stroke-linecap="round"/>
            <circle cx="54" cy="50" r="3.5" fill="#B8860B"/>
        </svg>
        <div class="cs-logo-text">Barber<span>Co</span></div>
    </a>

    <div class="cs-tagline">
        <i class="fas fa-cut"></i>&nbsp; Something Fresh Is in the Chair
    </div>

    <h1 class="cs-title">A New Experience<br>Is Being <em>Crafted</em></h1>
    <p class="cs-desc">We're sharpening our blades and putting the finishing touches on something special. Sign up below to be the first through the door.</p>

    <div class="cs-divider"></div>

    <!-- Countdown -->
    <div class="cs-countdown" id="countdown" data-target="2026-12-01T00:00:00">
        <div class="cs-unit"><div class="cs-unit-num" id="cd-days">--</div><div class="cs-unit-label">Days</div></div>
        <div class="cs-unit"><div class="cs-unit-num" id="cd-hours">--</div><div class="cs-unit-label">Hours</div></div>
        <div class="cs-unit"><div class="cs-unit-num" id="cd-minutes">--</div><div class="cs-unit-label">Mins</div></div>
        <div class="cs-unit"><div class="cs-unit-num" id="cd-seconds">--</div><div class="cs-unit-label">Secs</div></div>
    </div>

    <!-- Notify Form -->
    <form class="cs-notify-form" id="cs-notify-form">
        <input type="email" id="cs-email" placeholder="Enter your email address" required aria-label="Email for notification">
        <button type="submit" class="btn btn-primary" id="cs-notify-btn">
            <i class="fas fa-bell"></i> Notify Me
        </button>
    </form>

    <!-- Social -->
    <p style="font-size:0.78rem;color:rgba(255,255,255,0.35);margin-bottom:12px;letter-spacing:0.1em;text-transform:uppercase;">Follow Our Journey</p>
    <div class="cs-social">
        <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="#" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
        <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
    </div>

    <div class="cs-home-link">
        <i class="fas fa-arrow-left" style="font-size:0.7rem;"></i>
        Back to <a href="index.html" id="cs-back-home">BarberCo Home</a>
    </div>
</div>

<script src="script.js"></script>
<script>
const csForm = document.getElementById('cs-notify-form');
if (csForm) {
    csForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('cs-notify-btn');
        btn.textContent = '✓ You\'re on the list!';
        btn.style.background = '#2E7D32';
        btn.disabled = true;
        csForm.querySelector('input').value = '';
    });
}
</script>
</body>
</html>
