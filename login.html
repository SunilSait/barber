<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your BarberCo account to manage bookings, view your grooming history and access exclusive member benefits.">
    <title>Sign In | BarberCo Barbershop</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%23B8860B' opacity='.15'/%3E%3Ccircle cx='30' cy='32' r='8' fill='none' stroke='%23B8860B' stroke-width='7'/%3E%3Ccircle cx='30' cy='68' r='8' fill='none' stroke='%23B8860B' stroke-width='7'/%3E%3Cline x1='36' y1='37' x2='72' y2='72' stroke='%23B8860B' stroke-width='8' stroke-linecap='round'/%3E%3Cline x1='36' y1='63' x2='72' y2='28' stroke='%23B8860B' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<!-- Top-right controls -->
<div class="auth-top-icons">
    <button class="icon-btn dark-toggle" id="login-dark-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
        <i class="fas fa-moon"></i>
    </button>
    <button class="icon-btn rtl-toggle" id="login-rtl-toggle" title="Toggle RTL layout" aria-label="Toggle RTL">
        <i class="fas fa-exchange-alt"></i>
    </button>
</div>

<div class="auth-page" id="login-page">
    <!-- Background decorations -->
    <div class="auth-bg-decor">
        <div class="blob1"></div>
        <div class="blob2"></div>
    </div>

    <!-- Auth Card -->
    <div class="auth-card">
        <!-- Logo -->
        <a href="index.html" class="auth-logo" id="login-logo" aria-label="BarberCo Home">
            <svg width="36" height="36" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" rx="14" fill="var(--primary)" opacity="0.12"/>
                <rect width="100" height="100" rx="14" fill="none" stroke="var(--primary)" stroke-width="2" opacity="0.5"/>
                <circle cx="30" cy="32" r="8" fill="none" stroke="var(--primary)" stroke-width="3.5"/>
                <circle cx="30" cy="68" r="8" fill="none" stroke="var(--primary)" stroke-width="3.5"/>
                <line x1="36" y1="37" x2="72" y2="72" stroke="var(--primary)" stroke-width="4" stroke-linecap="round"/>
                <line x1="36" y1="63" x2="72" y2="28" stroke="var(--primary)" stroke-width="4" stroke-linecap="round"/>
                <circle cx="54" cy="50" r="3.5" fill="var(--primary)"/>
            </svg>
            <div class="auth-logo-text">Barber<span>Co</span></div>
        </a>

        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to manage your bookings & profile</p>

        <form class="auth-form" id="login-form">
            <div class="form-group">
                <label class="form-label" for="login-email">Email Address</label>
                <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label class="form-label" for="login-password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="auth-row">
                <label>
                    <input type="checkbox" id="login-remember"> Remember me
                </label>
                <a href="#" id="forgot-password-link">Forgot Password?</a>
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="login-submit-btn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <div class="auth-divider">or continue with</div>

        <div>
            <!-- Google -->
            <button class="btn-social" id="login-google-btn" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>
            <!-- Apple -->
            <button class="btn-social" id="login-apple-btn" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                </svg>
                Continue with Apple
            </button>
            <!-- Facebook -->
            <button class="btn-social" id="login-facebook-btn" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2" aria-hidden="true">
                    <path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.313 0 2.686.236 2.686.236v2.97h-1.513c-1.491 0-1.956.93-1.956 1.887v2.267h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/>
                </svg>
                Continue with Facebook
            </button>
        </div>

        <p class="auth-footer-text">Don't have an account? <a href="signup.html" id="login-signup-link">Create one free</a></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
