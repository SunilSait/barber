<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found — BarberCo. Return to our homepage and book your next great haircut.">
    <title>404 — Page Not Found | BarberCo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%23B8860B' opacity='.15'/%3E%3Ccircle cx='30' cy='32' r='8' fill='none' stroke='%23B8860B' stroke-width='7'/%3E%3Ccircle cx='30' cy='68' r='8' fill='none' stroke='%23B8860B' stroke-width='7'/%3E%3Cline x1='36' y1='37' x2='72' y2='72' stroke='%23B8860B' stroke-width='8' stroke-linecap='round'/%3E%3Cline x1='36' y1='63' x2='72' y2='28' stroke='%23B8860B' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #0B0B0B; }
        .err-bg-decor {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .err-bg-decor .c1 {
            position: absolute;
            top: -250px; right: -250px;
            width: 700px; height: 700px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212,160,23,0.14) 0%, rgba(184,134,11,0.03) 50%, transparent 70%);
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }
        .err-bg-decor .c2 {
            position: absolute;
            bottom: -200px; left: -200px;
            width: 550px; height: 550px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212,160,23,0.10) 0%, transparent 70%);
            animation: pulseGlow 6s ease-in-out infinite alternate-reverse;
        }
        .err-bg-decor .grid-lines {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(212,160,23,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212,160,23,0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        .error-page-inner {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 48px 24px;
            position: relative;
            z-index: 2;
        }
        .err-logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 44px;
            text-decoration: none;
            transition: transform 0.3s ease;
        }
        .err-logo:hover { transform: translateY(-2px); }
        .err-logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
        }
        .err-logo-text span { color: var(--primary-light); }
        
        /* Open Floating Hero Visual (No Box Card) */
        .err-open-hero {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            padding: 16px 24px;
        }
        .err-hero-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 380px; height: 380px;
            background: radial-gradient(circle, rgba(212,160,23,0.22) 0%, rgba(184,134,11,0.04) 55%, transparent 70%);
            border-radius: 50%;
            filter: blur(45px);
            pointer-events: none;
            z-index: 0;
            animation: heroGlowPulse 5s ease-in-out infinite alternate;
        }
        @keyframes heroGlowPulse {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.18); opacity: 0.85; }
        }

        /* Scissors Crest Vector Icon */
        .err-scissors-crest {
            position: relative;
            z-index: 1;
            width: 64px;
            height: 64px;
            margin-bottom: 18px;
            background: radial-gradient(circle, rgba(212,160,23,0.25) 0%, rgba(184,134,11,0.08) 100%);
            border: 1.5px solid rgba(212,160,23,0.45);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #D4A017;
            font-size: 1.5rem;
            box-shadow: 0 0 25px rgba(212,160,23,0.3);
            animation: floatScissors 3.5s ease-in-out infinite;
        }
        @keyframes floatScissors {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(6deg); }
        }

        .err-blade-badge {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 18px;
            background: linear-gradient(135deg, rgba(212,160,23,0.18), rgba(184,134,11,0.06));
            border: 1.5px solid rgba(212,160,23,0.35);
            border-radius: 50px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #B8860B;
            margin-bottom: 14px;
            box-shadow: var(--shadow-sm);
        }
        .dark .err-blade-badge { color: #D4A017; }

        .error-number {
            position: relative;
            z-index: 1;
            font-family: 'Playfair Display', serif;
            font-size: clamp(6.5rem, 18vw, 11.5rem);
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #FFF6D6 0%, #F0C450 30%, #D4A017 60%, #8B6508 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 14px 45px rgba(212,160,23,0.35);
            animation: goldShimmer 5s linear infinite;
            margin-bottom: 18px;
        }
        @keyframes goldShimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        /* Barber Pole Stripe Pill */
        .err-pole-bar {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 24px;
            background: var(--surface);
            border: 1.5px solid rgba(212,160,23,0.35);
            border-radius: 30px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .dark .err-pole-bar {
            background: rgba(22, 22, 22, 0.85);
            border-color: rgba(212,160,23,0.3);
        }
        .err-pole-bar::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; right: -100%; bottom: 0;
            background: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 10px,
                rgba(212, 160, 23, 0.12) 10px,
                rgba(212, 160, 23, 0.12) 20px
            );
            animation: moveStripes 10s linear infinite;
        }
        @keyframes moveStripes {
            0% { transform: translateX(0); }
            100% { transform: translateX(50px); }
        }
        .err-blade-bottom {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-dark);
            position: relative;
            z-index: 1;
            transition: color 0.3s ease;
        }
        .err-blade-bottom span { color: var(--primary-light); }

        .err-title-main {
            font-size: clamp(1.8rem, 4vw, 2.75rem);
            font-weight: 800;
            color: var(--text-dark) !important;
            margin-bottom: 14px;
            letter-spacing: -0.01em;
            transition: color 0.3s ease;
        }
        .err-title-main span {
            background: linear-gradient(135deg, #F0C450, #D4A017, #B8860B);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .err-desc { 
            color: var(--text-muted); 
            max-width: 480px; 
            margin: 0 auto 38px; 
            font-size: 1.05rem; 
            line-height: 1.7; 
            transition: color 0.3s ease;
        }

        .err-actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 48px; }
        .err-actions .btn-primary {
            background: linear-gradient(135deg, #D4A017 0%, #B8860B 100%);
            border: none;
            color: #111111;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(212,160,23,0.3);
            transition: all 0.3s ease;
        }
        .err-actions .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(212,160,23,0.45);
            background: linear-gradient(135deg, #E5B128 0%, #C9971C 100%);
        }
        .err-actions .btn-secondary {
            border: 1.5px solid var(--primary);
            color: var(--primary-dark);
            background: var(--surface);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .dark .err-actions .btn-secondary {
            border-color: rgba(212,160,23,0.4);
            color: #D4A017;
            background: rgba(212,160,23,0.05);
        }
        .err-actions .btn-secondary:hover {
            background: rgba(212,160,23,0.16);
            border-color: #D4A017;
            color: #D4A017;
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(212,160,23,0.2);
        }

        .err-quick-links { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; align-items: center; }
        .err-quick-links a {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
            transition: all 0.25s ease;
            position: relative;
        }
        .err-quick-links a:hover { 
            color: var(--primary-light);
            text-shadow: 0 0 12px rgba(212,160,23,0.4);
        }
        .err-quick-links span { color: var(--border-dark); font-size: 0.9rem; }

        @media (max-width: 600px) {
            .err-open-hero { padding: 8px 12px; margin-bottom: 28px; }
            .err-scissors-crest { width: 52px; height: 52px; font-size: 1.2rem; }
            .error-number { font-size: 6rem; }
        }
    </style>
</head>
<body>

<!-- Controls -->
<div class="auth-top-icons">
    <button class="icon-btn dark-toggle" id="err-dark-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
        <i class="fas fa-moon"></i>
    </button>
    <button class="icon-btn rtl-toggle" id="err-rtl-toggle" title="Toggle RTL" aria-label="Toggle RTL">
        <i class="fas fa-exchange-alt"></i>
    </button>
</div>

<!-- BG Decorations -->
<div class="err-bg-decor">
    <div class="c1"></div>
    <div class="c2"></div>
    <div class="grid-lines"></div>
</div>

<div class="error-page-inner">
    <!-- Logo → Home -->
    <a href="index.html" class="err-logo" id="err-logo" aria-label="BarberCo Home">
        <svg width="38" height="38" viewBox="0 0 100 100" fill="none">
            <rect width="100" height="100" rx="16" fill="#B8860B" opacity="0.2"/>
            <rect width="100" height="100" rx="16" fill="none" stroke="#D4A017" stroke-width="2" opacity="0.6"/>
            <circle cx="30" cy="32" r="8" fill="none" stroke="#D4A017" stroke-width="4"/>
            <circle cx="30" cy="68" r="8" fill="none" stroke="#D4A017" stroke-width="4"/>
            <line x1="36" y1="37" x2="72" y2="72" stroke="#D4A017" stroke-width="4.5" stroke-linecap="round"/>
            <line x1="36" y1="63" x2="72" y2="28" stroke="#D4A017" stroke-width="4.5" stroke-linecap="round"/>
            <circle cx="54" cy="50" r="4" fill="#D4A017"/>
        </svg>
        <div class="err-logo-text">Barber<span>Co</span></div>
    </a>

    <!-- Open Floating 3D Hero Visual (No Box Card) -->
    <div class="err-open-hero">
        <div class="err-hero-glow"></div>
        <div class="err-scissors-crest">
            <i class="fas fa-scissors"></i>
        </div>
        <div class="err-blade-badge">
            <i class="fas fa-crown" style="font-size: 0.65rem;"></i> BarberCo — Est. 2012
        </div>
        <div class="error-number">404</div>
        <div class="err-pole-bar">
            <div class="err-blade-bottom"><i class="fas fa-cut" style="color: var(--primary-light); margin-right: 6px;"></i> This Page Got a <span>Buzz Cut</span></div>
        </div>
    </div>

    <h1 class="err-title-main">Looks Like This Page <span>Left the Chair</span></h1>
    <p class="err-desc">The page you're looking for has been moved, deleted, or never existed. Even our sharpest razor can't bring it back.</p>

    <div class="err-actions">
        <a href="index.html" class="btn btn-primary btn-lg" id="err-home-btn">
            <i class="fas fa-house"></i> Back to Home
        </a>
        <a href="contact.html" class="btn btn-secondary btn-lg" id="err-contact-btn">
            <i class="fas fa-phone"></i> Contact Us
        </a>
    </div>

    <div class="err-quick-links">
        <a href="services.html">Services</a>
        <span>·</span>
        <a href="gallery.html">Gallery</a>
        <span>·</span>
        <a href="pricing.html">Pricing</a>
        <span>·</span>
        <a href="about.html">About</a>
        <span>·</span>
        <a href="contact.html#booking">Book Now</a>
    </div>
</div>

<script src="script.js"></script>
<style>
body { background: var(--bg); color: var(--text-dark); transition: background-color 0.3s ease; }
.dark body { background: #0B0B0B; }
.icon-btn { background: var(--surface); border-color: var(--border); color: var(--text-dark); backdrop-filter: blur(8px); }
.icon-btn:hover { border-color: #D4A017; color: #D4A017; background: rgba(212,160,23,0.15); box-shadow: 0 0 15px rgba(212,160,23,0.3); }
</style>
</body>
</html>
