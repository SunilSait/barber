<!DOCTYPE html>

<head>

    <style>
        body { background: #111111; }
        .err-bg-decor {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .err-bg-decor .c1 {
            position: absolute;
            top: -200px; right: -200px;
            width: 600px; height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(184,134,11,0.10) 0%, transparent 70%);
        }
        .err-bg-decor .c2 {
            position: absolute;
            bottom: -150px; left: -150px;
            width: 450px; height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(184,134,11,0.07) 0%, transparent 70%);
        }
        .err-bg-decor .grid-lines {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(184,134,11,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(184,134,11,0.04) 1px, transparent 1px);
            background-size: 56px 56px;
        }
        .error-page-inner {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
            position: relative;
            z-index: 2;
        }
        .err-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 56px;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .err-logo:hover { opacity: 0.8; }
        .err-logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 800;
            color: #FFFFFF;
        }
        .err-logo-text span { color: #D4A017; }
        .err-visual {
            position: relative;
            margin-bottom: 40px;
        }
        .err-visual::before {
            content: '';
            position: absolute;
            inset: -24px;
            border: 2px dashed rgba(184,134,11,0.25);
            border-radius: 24px;
        }
        .err-visual-inner {
            background: rgba(184,134,11,0.06);
            border: 1px solid rgba(184,134,11,0.2);
            border-radius: 20px;
            padding: 40px 56px;
        }
        .err-blade {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(184,134,11,0.5);
            margin-bottom: 8px;
        }
        .err-blade-bottom {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(184,134,11,0.35);
            margin-top: 8px;
        }
        .err-title-main {
            color: #FFFFFF !important;
            margin-bottom: 12px;
        }
        .err-title-main span {
            background: linear-gradient(135deg, #B8860B, #D4A017, #B8860B);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .err-desc { color: rgba(255,255,255,0.5); max-width: 460px; margin: 0 auto 36px; font-size: 1rem; line-height: 1.8; }
        .err-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-bottom: 48px; }
        .err-quick-links { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
        .err-quick-links a {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            transition: color 0.2s;
        }
        .err-quick-links a:hover { color: #D4A017; }
        .err-quick-links span { color: rgba(255,255,255,0.15); }
    </style>
</head>
<body>

<!-- Controls -->
<div class="auth-top-icons">
    <button class="icon-btn dark-toggle" id="err-dark-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">

    <button class="icon-btn rtl-toggle" id="err-rtl-toggle" title="Toggle RTL" aria-label="Toggle RTL">

</div>

<div class="error-page-inner">
    <!-- Logo → Home -->
    <a href="index.html" class="err-logo" id="err-logo" aria-label="BarberCo Home">
        <svg width="36" height="36" viewBox="0 0 100 100" fill="none">

            <circle cx="30" cy="32" r="8" fill="none" stroke="#B8860B" stroke-width="3.5"/>

            <line x1="36" y1="37" x2="72" y2="72" stroke="#B8860B" stroke-width="4" stroke-linecap="round"/>
            <line x1="36" y1="63" x2="72" y2="28" stroke="#B8860B" stroke-width="4" stroke-linecap="round"/>
            <circle cx="54" cy="50" r="3.5" fill="#B8860B"/>
        </svg>
        <div class="err-logo-text">Barber<span>Co</span></div>
    </a>

    <!-- Visual -->
    <div class="err-visual">
        <div class="err-visual-inner">
            <div class="err-blade">BarberCo — Est. 2012</div>
            <div class="error-number">404</div>
            <div class="err-blade-bottom">This Page Got a Buzz Cut</div>
        </div>
    </div>

    <h1 class="err-title-main">Looks Like This Page <span>Left the Chair</span></h1>
    <p class="err-desc">The page you're looking for has been moved, deleted, or never existed. Even our sharpest razor can't bring it back.</p>

    <div class="err-actions">
        <a href="index.html" class="btn btn-primary btn-lg" id="err-home-btn">
            <i class="fas fa-house"></i> Back to Home
        </a>
        <a href="contact.html" class="btn btn-secondary btn-lg" id="err-contact-btn" style="border-color:rgba(184,134,11,0.4);color:#D4A017;">
            <i class="fas fa-phone-alt"></i> Contact Us

    <div class="err-quick-links">

        <span>·</span>
        <a href="pricing.html">Pricing</a>
        <span>·</span>
        <a href="about.html">About</a>

        <a href="contact.html#booking">Book Now</a>

</div>
